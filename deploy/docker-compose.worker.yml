# Produktionsbetrieb des Scan-Workers auf einem separaten Docker-Host.
# Start: docker compose -f deploy/docker-compose.worker.yml --env-file /etc/cybersafe24/worker.env up -d
services:
  worker:
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    image: cybersafe24-worker:latest
    restart: unless-stopped
    env_file: /etc/cybersafe24/worker.env   # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DATA_ENCRYPTION_KEY, HIBP_API_KEY, ...
    read_only: true
    tmpfs: ["/tmp:size=64m", "/home/scanner:size=64m,uid=10001"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    ulimits: { nofile: { soft: 4096, hard: 4096 } }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    stop_grace_period: 60s
    networks: [egress]
networks:
  egress:
    driver: bridge
    # Hinweis: Ausgehender Verkehr in private Netze wird zusätzlich auf Host-Ebene per Firewall
    # blockiert (siehe docs/DEPLOYMENT.md, Abschnitt "Egress-Firewall").
